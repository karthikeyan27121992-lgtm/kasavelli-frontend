<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Radial Gradient matching brand theme -->
    <radialGradient id="logo-bg-grad" cx="70%" cy="30%" r="85%" fx="60%" fy="25%">
      <stop offset="0%" stop-color="#b8337a"/>
      <stop offset="45%" stop-color="#881e62"/>
      <stop offset="85%" stop-color="#550e42"/>
      <stop offset="100%" stop-color="#38072e"/>
    </radialGradient>

    <!-- Linear Gradient for Subtle Depth -->
    <linearGradient id="logo-linear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#400732"/>
      <stop offset="50%" stop-color="#881e62"/>
      <stop offset="100%" stop-color="#b8337a"/>
    </linearGradient>

    <!-- 4-pointed Emerald/Dark Sparkle Star as shown in reference image -->
    <g id="sparkle-star">
      <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#0d3824"/>
    </g>

    <!-- Diamond Jewel Symbol on K and S -->
    <g id="diamond-gem">
      <!-- Facet polygons with sparkling clean facets -->
      <polygon points="-10,-2 -5,-10 5,-10 10,-2 0,11" fill="#ffffff" fill-opacity="0.95" stroke="#0d3824" stroke-width="0.75" stroke-linejoin="round"/>
      <polygon points="-5,-10 5,-10 2.5,-2 -2.5,-2" fill="#ffffff" stroke="#0d3824" stroke-width="0.6"/>
      <polygon points="-10,-2 -5,-10 -2.5,-2" fill="#e8f3ee" stroke="#0d3824" stroke-width="0.6"/>
      <polygon points="10,-2 5,-10 2.5,-2" fill="#e8f3ee" stroke="#0d3824" stroke-width="0.6"/>
      <polygon points="-2.5,-2 2.5,-2 0,11" fill="#ffffff" stroke="#0d3824" stroke-width="0.6"/>
      <polygon points="-10,-2 -2.5,-2 0,11" fill="#d9ece3" stroke="#0d3824" stroke-width="0.6"/>
      <polygon points="10,-2 2.5,-2 0,11" fill="#d9ece3" stroke="#0d3824" stroke-width="0.6"/>
    </g>
  </defs>

  <!-- Circular Badge Background with Exact Reference Magenta-Purple Gradient -->
  <circle cx="250" cy="250" r="240" fill="url(#logo-bg-grad)"/>

  <!-- Orbital Rings with Dark Emerald Strokes as in the Reference -->
  <!-- Orbital Ring 1 (Left tilted) -->
  <ellipse cx="236" cy="245" rx="192" ry="182" fill="none" stroke="#0d3824" stroke-width="2.6" transform="rotate(-28 236 245)"/>

  <!-- Orbital Ring 2 (Right tilted) -->
  <ellipse cx="264" cy="245" rx="192" ry="182" fill="none" stroke="#0d3824" stroke-width="2.6" transform="rotate(26 264 245)"/>

  <!-- Sparkle Stars Placed Exactly on the Orbital Intersections & Perimeters -->
  <!-- Top Center Stars -->
  <use href="#sparkle-star" x="274" y="65" transform="scale(1.15) translate(-22,-7)"/>
  <use href="#sparkle-star" x="212" y="86" transform="scale(0.95) translate(14,4)"/>

  <!-- Right Orbit Stars -->
  <use href="#sparkle-star" x="448" y="278" transform="scale(1.15) translate(-42,-4)"/>
  <use href="#sparkle-star" x="408" y="308" transform="scale(0.9) translate(18,10)"/>

  <!-- Bottom Orbit Stars -->
  <use href="#sparkle-star" x="264" y="440" transform="scale(1.15) translate(-24,-34)"/>
  <use href="#sparkle-star" x="216" y="456" transform="scale(0.95) translate(18,-24)"/>

  <!-- Left Orbit Stars -->
  <use href="#sparkle-star" x="52" y="282" transform="scale(1.15) translate(0,-24)"/>
  <use href="#sparkle-star" x="98" y="258" transform="scale(0.95) translate(0,6)"/>

  <!-- ================= LOGO TYPOGRAPHY ================= -->
  <!-- 1. KASA Line (Elegant high-contrast Didone / Serif font) -->
  <g id="kasa-text" transform="translate(250, 222)">
    <!-- Letter 'K' with left pillar diamond -->
    <!-- Left vertical stem of K -->
    <path d="M -118,-44 L -110,-44 L -110,28 L -118,28 Z" fill="#FFFFFF"/>
    <!-- Top left diamond on K's stem -->
    <use href="#diamond-gem" x="-114" y="-55" transform="scale(0.95)"/>
    <!-- K diagonal legs with elegant serifs -->
    <path d="M -110,-10 Q -94,-12 -76,-44 L -62,-44 L -91,-2 L -60,28 L -74,28 L -100,4 L -110,14 Z" fill="#FFFFFF"/>

    <!-- Letter 'A' (First) -->
    <path d="M -46,28 L -24,-44 L -12,-44 L 11,28 L -1,28 L -9,-2 L -37,-2 L -42,28 Z M -34,-13 L -12,-13 L -18,-31 Z" fill="#FFFFFF"/>

    <!-- Letter 'S' with diamond topping the upper curve -->
    <path d="M 52,-40 Q 38,-48 22,-40 Q 10,-32 16,-18 Q 21,-4 43,2 Q 60,8 55,22 Q 50,32 32,30 Q 16,28 8,18 L 8,28 Q 22,38 38,36 Q 64,34 66,14 Q 68,-4 44,-12 Q 28,-18 30,-28 Q 32,-36 44,-34 Q 52,-33 58,-26 Z" fill="#FFFFFF"/>
    <!-- Diamond resting on S -->
    <use href="#diamond-gem" x="46" y="-36" transform="scale(0.92)"/>

    <!-- Letter 'A' (Second) -->
    <path d="M 74,28 L 96,-44 L 108,-44 L 131,28 L 119,28 L 111,-2 L 83,-2 L 78,28 Z M 86,-13 L 108,-13 L 102,-31 Z" fill="#FFFFFF"/>
  </g>

  <!-- 2. VELLI Line (Crisp spaced typography) -->
  <text x="250" y="306" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-size="32" 
        font-weight="500" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="22">VELLI</text>

  <!-- 3. 925 Hallmark Line -->
  <text x="250" y="366" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="500" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="5">925</text>
</svg>
