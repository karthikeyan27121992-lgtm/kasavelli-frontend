<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- 4-Pointed Dark Green Sparkle Star -->
    <g id="sparkle-star">
      <path d="M 0,-16 C 0,-4 4,0 16,0 C 4,0 0,4 0,16 C 0,4 -4,0 -16,0 C -4,0 0,-4 0,-16 Z" fill="#0d3522"/>
    </g>

    <!-- Faceted Brilliant Diamond for Letter K and Letter S -->
    <g id="diamond-gem">
      <polygon points="-8,-1 -4,-8 4,-8 8,-1 0,9" fill="#ffffff" stroke="#0d3522" stroke-width="0.8" stroke-linejoin="round"/>
      <polygon points="-4,-8 4,-8 2,-1 -2,-1" fill="#ffffff" stroke="#0d3522" stroke-width="0.5"/>
      <polygon points="-8,-1 -4,-8 -2,-1" fill="#f0f7f3" stroke="#0d3522" stroke-width="0.5"/>
      <polygon points="8,-1 4,-8 2,-1" fill="#f0f7f3" stroke="#0d3522" stroke-width="0.5"/>
      <polygon points="-2,-1 2,-1 0,9" fill="#ffffff" stroke="#0d3522" stroke-width="0.5"/>
      <polygon points="-8,-1 -2,-1 0,9" fill="#e2f0ea" stroke="#0d3522" stroke-width="0.5"/>
      <polygon points="8,-1 2,-1 0,9" fill="#e2f0ea" stroke="#0d3522" stroke-width="0.5"/>
    </g>
  </defs>

  <!-- ================= ORBITAL GEOMETRIC RINGS (Clean Transparent Vector) ================= -->
  <!-- Left Ring: Fine dark green ellipse tilted at -30 deg -->
  <ellipse cx="232" cy="246" rx="192" ry="176" fill="none" stroke="#0d3522" stroke-width="2.4" transform="rotate(-30 232 246)"/>

  <!-- Right Ring: Fine dark green ellipse tilted at +28 deg -->
  <ellipse cx="268" cy="246" rx="192" ry="176" fill="none" stroke="#0d3522" stroke-width="2.4" transform="rotate(28 268 246)"/>

  <!-- ================= 8 GREEN SPARKLE STARS ================= -->
  <!-- Top Pair -->
  <use href="#sparkle-star" x="272" y="72" transform="scale(1.15) translate(-24,-7)"/>
  <use href="#sparkle-star" x="214" y="90" transform="scale(0.95) translate(14,3)"/>

  <!-- Right Pair -->
  <use href="#sparkle-star" x="435" y="278" transform="scale(1.1) translate(-36,-5)"/>
  <use href="#sparkle-star" x="398" y="306" transform="scale(0.9) translate(16,8)"/>

  <!-- Bottom Pair -->
  <use href="#sparkle-star" x="268" y="432" transform="scale(1.1) translate(-26,-30)"/>
  <use href="#sparkle-star" x="220" y="446" transform="scale(0.95) translate(18,-22)"/>

  <!-- Left Pair -->
  <use href="#sparkle-star" x="65" y="284" transform="scale(1.15) translate(0,-24)"/>
  <use href="#sparkle-star" x="105" y="260" transform="scale(0.9) translate(0,6)"/>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- 1. KASA — High-Contrast Didone Serif with Custom Diamonds -->
  <g id="kasa-wordmark" transform="translate(250, 222)">
    <!-- ── Letter K ── -->
    <path d="M -118,-42 L -108,-42 L -108,26 L -118,26 Z" fill="#FFFFFF"/>
    <!-- Top-left diamond crowning the K stem -->
    <use href="#diamond-gem" x="-113" y="-50" transform="scale(1.05)"/>
    <!-- Diagonal upper arm with sweeping serif -->
    <path d="M -108,-6 Q -90,-18 -72,-42 L -58,-42 Q -76,-16 -96,0 Z" fill="#FFFFFF"/>
    <!-- Diagonal lower leg extending down with serif -->
    <path d="M -98,-3 L -60,26 L -74,26 L -105,2 Z" fill="#FFFFFF"/>

    <!-- ── Letter A (First) ── -->
    <path d="M -44,26 L -24,-42 L -14,-42 L 7,26 L -3,26 L -10,2 L -37,2 L -41,26 Z M -34,-8 L -13,-8 L -20,-28 Q -21,-25 -26,-13 Z" fill="#FFFFFF"/>

    <!-- ── Letter S ── -->
    <path d="M 52,-38 Q 38,-46 22,-38 Q 10,-30 16,-16 Q 21,-2 43,4 Q 60,10 55,24 Q 50,34 32,32 Q 16,30 8,20 L 8,30 Q 22,40 38,38 Q 64,36 66,16 Q 68,-2 44,-10 Q 28,-16 30,-26 Q 32,-34 44,-32 Q 52,-31 58,-24 Z" fill="#FFFFFF"/>
    <!-- Diamond resting on top curve of S -->
    <use href="#diamond-gem" x="46" y="-36" transform="scale(0.95)"/>

    <!-- ── Letter A (Second) ── -->
    <path d="M 74,26 L 94,-42 L 104,-42 L 125,26 L 115,26 L 108,2 L 81,2 L 77,26 Z M 84,-8 L 105,-8 L 98,-28 Q 97,-25 92,-13 Z" fill="#FFFFFF"/>
  </g>

  <!-- 2. VELLI — High Legibility Spaced Serif Subtitle -->
  <g id="velli-wordmark" transform="translate(250, 302)">
    <text x="0" y="0" 
          font-family="'Playfair Display', Didot, 'Bodoni MT', Georgia, serif" 
          font-size="28" 
          font-weight="500" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="20">VELLI</text>
  </g>

  <!-- 3. 925 — Pure Silver Hallmark -->
  <g id="hallmark-925" transform="translate(250, 362)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-size="20" 
          font-weight="500" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="5">925</text>
  </g>
</svg>
